name: Deploy auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Der Rechenkern ist das Produkt. Schlaegt hier etwas fehl, wird nicht
      # veroeffentlicht - eine falsche Zahl ist schlimmer als eine alte Seite.
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /vom-gehalt-zum-vermoegen
      # Ohne diese Datei ignoriert GitHub Pages alle Ordner mit Unterstrich.
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
